<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
  <div class="bg-white dark:bg-slate-900 rounded-xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 border border-gray-100 dark:border-slate-800 transition-colors">
    <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-slate-800">
      <div>
        <h2 class="text-xl font-bold text-gray-900 dark:text-white">{{ isEditMode ? 'Edit Refuel Expense' : 'Log Refuel Expense' }}</h2>
        <p class="text-xs text-gray-500 dark:text-slate-400">Record fuel volume, price and station receipt</p>
      </div>
      <button (click)="cancel.emit()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-2xl leading-none">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-4 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Refuel Date *</label>
          <input type="date" formControlName="date"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Odometer (km) *</label>
          <input type="number" formControlName="mileageAtRefuel"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Volume (Liters / Gal) *</label>
          <input type="number" step="0.01" formControlName="volume" (input)="onVolumeOrUnitCostChange()"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Unit Cost ($)</label>
          <input type="number" step="0.001" formControlName="unitCost" (input)="onVolumeOrUnitCostChange()"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div class="p-3 bg-amber-50 dark:bg-amber-950/40 rounded-lg flex items-center justify-between border border-amber-200 dark:border-amber-900/40">
        <div>
          <span class="text-xs uppercase font-semibold text-amber-900 dark:text-amber-300 block">Total Fuel Cost:</span>
          <span class="text-xs text-amber-700 dark:text-amber-400">Can be entered directly or calculated</span>
        </div>
        <div class="w-36">
          <input type="number" step="0.01" formControlName="totalCost"
            class="w-full text-right font-bold text-amber-900 dark:text-amber-200 rounded-lg border border-amber-300 dark:border-amber-800 bg-white dark:bg-slate-800 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Fuel Type</label>
          <select formControlName="fuelType"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="Regular">Regular 87</option>
            <option value="Premium">Premium 91/95</option>
            <option value="Super">Super Premium 98</option>
            <option value="Diesel">Diesel</option>
            <option value="CNG">CNG / Gas</option>
            <option value="Electricity">Electricity (kWh)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Station / Provider</label>
          <input type="text" formControlName="station" placeholder="e.g. Shell, BP, Mobil"
            class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-slate-300">Notes</label>
        <textarea rows="2" formControlName="notes" placeholder="Full tank, highway trip, discount voucher..."
          class="mt-1 w-full rounded-lg border border-gray-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>

      <div class="flex justify-end space-x-3 pt-3 border-t border-gray-100 dark:border-slate-800">
        <button type="button" (click)="cancel.emit()"
          class="px-4 py-2 border border-gray-300 dark:border-slate-700 rounded-lg text-sm font-medium text-gray-700 dark:text-slate-300 hover:bg-gray-50 dark:hover:bg-slate-800">
          Cancel
        </button>
        <button type="submit" [disabled]="form.invalid || submitting"
          class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm font-medium disabled:opacity-50 transition">
          {{ submitting ? 'Saving...' : (isEditMode ? 'Update Refuel Record' : 'Save Refuel Record') }}
        </button>
      </div>
    </form>
  </div>
</div>
